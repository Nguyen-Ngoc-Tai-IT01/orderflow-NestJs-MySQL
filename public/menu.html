<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderFlow | Quản lý thực đơn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/orders-extra.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>

<body data-page="menu"
      data-title="Quản lý thực đơn"
      data-subtitle="Thêm món, cập nhật giá, hình ảnh và trạng thái bán."
      data-search-placeholder="Tìm tên món ăn...">

<div class="app-container">
    <!-- Sidebar + Header được /js/pages-common.js dựng tự động -->
    <main class="main-content">

        <div id="shellHeader"></div>

        <div class="dashboard-content">
            <section class="statistics-grid">
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Tổng số món</span>
                        <div class="stat-icon purple"><i class="bi bi-cup-hot"></i></div>
                    </div>
                    <h2 id="statTotal">0</h2>
                    <p>Tất cả món trong thực đơn</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Đang bán</span>
                        <div class="stat-icon green"><i class="bi bi-check-circle"></i></div>
                    </div>
                    <h2 id="statOn">0</h2>
                    <p>Khách có thể gọi món</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Ngừng bán</span>
                        <div class="stat-icon orange"><i class="bi bi-slash-circle"></i></div>
                    </div>
                    <h2 id="statOff">0</h2>
                    <p>Tạm ẩn khỏi thực đơn</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Phân loại</span>
                        <div class="stat-icon blue"><i class="bi bi-tags"></i></div>
                    </div>
                    <h2 id="statCategories">0</h2>
                    <p>Số nhóm món</p>
                </article>
            </section>

            <section class="orders-section">
                <div class="section-header">
                    <div>
                        <h2>Danh sách món ăn</h2>
                        <p>Món bị "Ngừng bán" vẫn được giữ lại để không mất lịch sử đơn hàng.</p>
                    </div>
                    <div class="pg-actions-bar">
                        <button type="button" class="refresh-button" id="refreshButton">
                            <i class="bi bi-arrow-clockwise"></i> Làm mới
                        </button>
                        <button type="button" class="of-btn of-btn-primary" id="addMenu"><i class="bi bi-plus-lg"></i> Thêm món</button>
                    </div>
                </div>

                <div class="pg-filters">
                    <select class="pg-select" id="categoryFilter" aria-label="Lọc theo phân loại">
                        <option value="">Tất cả phân loại</option>
                    </select>
                    <select class="pg-select" id="availabilityFilter" aria-label="Lọc theo trạng thái">
                        <option value="">Tất cả trạng thái</option>
                        <option value="on">Đang bán</option>
                        <option value="off">Ngừng bán</option>
                    </select>
                </div>

                <div id="pageLoading" class="loading-state" hidden>
                    <div class="loading-spinner"></div>
                    <p>Đang tải dữ liệu...</p>
                </div>

                <div class="pg-card-grid" id="menuGrid"></div>
            </section>
        </div>

        <footer class="footer">
            <span>© 2026 OrderFlow.</span>
            <span>Hệ thống quản lý nhà hàng</span>
        </footer>
    </main>
</div>

<!-- Thứ tự quan trọng -->
<script src="/js/common.js"></script>
<script src="/js/pages-common.js"></script>
<script src="/js/menu.js"></script>
</body>
</html>
