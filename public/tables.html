<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderFlow | Quản lý bàn ăn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/orders-extra.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>

<body data-page="tables"
      data-title="Quản lý bàn ăn"
      data-subtitle="Theo dõi trạng thái bàn và xử lý đặt chỗ."
      data-search-placeholder="Tìm số bàn, tên khách, SĐT...">

<div class="app-container">
    <!-- Sidebar + Header được /js/pages-common.js dựng tự động -->
    <main class="main-content">

        <div id="shellHeader"></div>

        <div class="dashboard-content">
            <section class="statistics-grid">
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Tổng số bàn</span>
                        <div class="stat-icon purple"><i class="bi bi-grid"></i></div>
                    </div>
                    <h2 id="statTotal">0</h2>
                    <p>Tất cả bàn trong nhà hàng</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Bàn trống</span>
                        <div class="stat-icon green"><i class="bi bi-check-circle"></i></div>
                    </div>
                    <h2 id="statAvailable">0</h2>
                    <p>Sẵn sàng đón khách</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Đang phục vụ</span>
                        <div class="stat-icon orange"><i class="bi bi-people"></i></div>
                    </div>
                    <h2 id="statOccupied">0</h2>
                    <p>Bàn đang có khách</p>
                </article>
                <article class="stat-card">
                    <div class="stat-card-header">
                        <span>Đã đặt trước</span>
                        <div class="stat-icon blue"><i class="bi bi-calendar-check"></i></div>
                    </div>
                    <h2 id="statReserved">0</h2>
                    <p>Bàn có khách đặt chỗ</p>
                </article>
            </section>

            <section class="orders-section">
                <div class="section-header">
                    <div>
                        <h2>Danh sách bàn</h2>
                        <p>Nhận khách, trả bàn, đặt chỗ và chỉnh sửa thông tin bàn.</p>
                    </div>
                    <div class="pg-actions-bar">
                        <button type="button" class="refresh-button" id="refreshButton">
                            <i class="bi bi-arrow-clockwise"></i> Làm mới
                        </button>
                        <button type="button" class="of-btn of-btn-primary" id="addTable"><i class="bi bi-plus-lg"></i> Thêm bàn</button>
                    </div>
                </div>

                <div class="order-toolbar">
                    <div class="order-tabs" id="pageTabs">
                        <button type="button" class="tab-button active" data-tab="ALL">Tất cả <span id="countAll">0</span></button>
                        <button type="button" class="tab-button" data-tab="AVAILABLE">Trống <span id="countAvailable">0</span></button>
                        <button type="button" class="tab-button" data-tab="OCCUPIED">Đang phục vụ <span id="countOccupied">0</span></button>
                        <button type="button" class="tab-button" data-tab="RESERVED">Đã đặt <span id="countReserved">0</span></button>
                    </div>
                </div>

                <div id="pageLoading" class="loading-state" hidden>
                    <div class="loading-spinner"></div>
                    <p>Đang tải dữ liệu...</p>
                </div>

                <div class="pg-card-grid" id="tableGrid"></div>
            </section>
        </div>

        <footer class="footer">
            <span>© 2026 OrderFlow.</span>
            <span>Hệ thống quản lý nhà hàng</span>
        </footer>
    </main>
</div>

<!-- Thứ tự quan trọng -->
<script src="/js/common.js"></script>
<script src="/js/pages-common.js"></script>
<script src="/js/tables.js"></script>
</body>
</html>
